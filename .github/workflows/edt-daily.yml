name: EDT Discord quotidien

on:
  schedule:
    # 06:00 UTC = 07:00 (hiver) / 08:00 (été) à Paris — du lundi au samedi
    - cron: "7 5 * * MON-SAT"
  workflow_dispatch:
    inputs:
      date:
        description: "Date cible (YYYY-MM-JJ). Vide = aujourd'hui."
        required: false
        default: ""
      dry_run:
        description: "Simulation : affiche les embeds sans rien envoyer à Discord"
        required: false
        default: false
        type: boolean

jobs:
  envoi-edt:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Envoi des emplois du temps
        env:
          EDT_DATE: ${{ inputs.date }}
          EDT_DRY_RUN: ${{ inputs.dry_run }}
          WEBHOOK_EDT1A: ${{ secrets.WEBHOOK_EDT1A }}
          WEBHOOK_EDT1B: ${{ secrets.WEBHOOK_EDT1B }}
          WEBHOOK_EDT2A: ${{ secrets.WEBHOOK_EDT2A }}
          WEBHOOK_EDT2B: ${{ secrets.WEBHOOK_EDT2B }}
        run: python edt_discord.py
